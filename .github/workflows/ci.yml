name: CI

on:
  push:
    branches: [main]
    # A release is a version tag, matching the other project on this server: the
    # images are built and pushed from the tag, and the tag is what the compose
    # file on the box pins to.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ascii:
    name: Plain ASCII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The project is written in plain ASCII: an em dash, an arrow or a curly
      # quote pasted in from somewhere else is a bug in the source, not a style
      # preference. The script names its own exceptions and says why.
      - name: Check every tracked file
        run: python3 scripts/check-ascii.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore -c Release

      # The suite runs against a real Postgres through Testcontainers, which uses
      # the Docker daemon the runner already provides.
      - name: Test with coverage
        working-directory: backend
        run: |
          dotnet test --no-build -c Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            --logger "trx;LogFileName=results.trx"

      - name: Check the coverage floor
        run: python3 scripts/check-coverage.py 'backend/TestResults/*/coverage.cobertura.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/TestResults/**/*.trx
            backend/TestResults/**/coverage.cobertura.xml

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Thresholds live in vitest.config.ts, per layer, so this fails on its own
      # when coverage of the logic drops.
      - name: Test with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  images:
    name: Build and publish images
    # On a version tag only, after every gate has passed. The same release model as
    # the other project on this server: tag, images, then the box pulls them.
    needs: [ascii, backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Docker Hub, under the same account as everything else on that machine.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # :latest tracks the highest version tag, and the three semver tags let the
      # compose file pin as loosely or as tightly as it likes.
      - uses: docker/metadata-action@v5
        id: api-meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/split-everything-api
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/metadata-action@v5
        id: web-meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/split-everything-web
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Publish the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Publish the web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          # Vite inlines these at build time, so they belong to the image rather
          # than to the runtime environment. The version travels with them, which
          # is what a crash report from a phone names.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Tell the server to pull
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Optional, and the one thing here the other project does not do: it pulls
      # its own images on the box. This skips itself when the secret is unset, so
      # the release is complete either way.
      - name: Trigger the redeploy webhook
        run: |
          if [ -z "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            echo "PORTAINER_WEBHOOK_URL is not set; pull the new tag on the server."
            exit 0
          fi

          status=$(curl --silent --show-error --output /dev/stderr \
            --write-out '%{http_code}' \
            --request POST \
            --max-time 60 \
            "${{ secrets.PORTAINER_WEBHOOK_URL }}")

          echo "The webhook responded with ${status}"

          case "$status" in
            2*) echo "Deploy triggered." ;;
            *) echo "The webhook was refused." >&2; exit 1 ;;
          esac
