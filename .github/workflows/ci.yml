name: CI

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore -c Release

      - name: Test with coverage
        working-directory: backend
        run: |
          dotnet test --no-build -c Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            --logger "trx;LogFileName=results.trx"

      - name: Check the coverage floor
        run: python3 scripts/check-coverage.py 'backend/TestResults/*/coverage.cobertura.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend/TestResults/**/*.trx
            backend/TestResults/**/coverage.cobertura.xml

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # One job per image so the two build at once. They share nothing but the registry
  # login, and the api's dotnet publish and the web's npm build were taking their
  # turns for no reason - the slower of the two is now the whole wait rather than
  # the sum. Each keeps its own buildx cache scope, which it had already.
  images:
    name: Build and publish ${{ matrix.image }}
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One image failing does not make the other one worth abandoning: whichever
      # succeeded is published, and the deploy below is what refuses to run.
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
            extra_args: ''
          - image: web
            context: frontend
            extra_args: |
              VITE_API_BASE_URL=/api
              VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/split-everything-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Publish the ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only what each image declares. Handing the api the web's arguments would
          # build it just the same and warn about every one it did not consume.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            ${{ matrix.extra_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Tell the server to pull
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Dockhand manages the stack on that box. Its own webhook is for git-linked
      # stacks and this one is a local compose file, so the redeploy goes through
      # its API instead: POST a stack by name and it pulls and recreates.
      #
      # Both secrets absent means nobody has wired this up, which is a fine state to
      # be in - the images are published either way and the box can pull them by
      # hand. It says so and passes rather than failing a release over a deploy
      # nobody asked for. What it will not do is what the old version of this job
      # did: report success while doing nothing at all.
      - name: Ask dockhand to redeploy the stack
        env:
          DOCKHAND_URL: ${{ secrets.DOCKHAND_URL }}
          DOCKHAND_TOKEN: ${{ secrets.DOCKHAND_TOKEN }}
          STACK: ${{ vars.DOCKHAND_STACK || 'split-everything' }}
          ENVIRONMENT_ID: ${{ vars.DOCKHAND_ENVIRONMENT_ID || '1' }}
        run: |
          if [ -z "$DOCKHAND_URL" ] || [ -z "$DOCKHAND_TOKEN" ]; then
            echo "DOCKHAND_URL or DOCKHAND_TOKEN is not set."
            echo "The images are published; pull them on the server with:"
            echo "  docker compose pull && docker compose up -d"
            exit 0
          fi

          # The deploy is a job: this call queues it and answers 200 with an id
          # while the work happens afterwards. A 200 here means "accepted", not
          # "deployed" - the first version of this took it for the second, got a
          # jobId for a request whose environment it had misnamed, and reported a
          # release deployed while the box carried on running the old images.
          accepted=$(mktemp)
          status=$(curl --silent --show-error --output "$accepted" \
            --write-out '%{http_code}' \
            --request POST \
            --max-time 60 \
            --header "Authorization: Bearer $DOCKHAND_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"pull": true}' \
            "$DOCKHAND_URL/api/stacks/$STACK/deploy?env=$ENVIRONMENT_ID")

          cat "$accepted"

          case "$status" in
            2*) ;;
            401|403) echo "The token was refused. Generate a new one in Dockhand under Profile." >&2; exit 1 ;;
            404) echo "No stack called ${STACK} in environment ${ENVIRONMENT_ID}." >&2; exit 1 ;;
            *) echo "Dockhand refused the redeploy (HTTP ${status})." >&2; exit 1 ;;
          esac

          job=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["jobId"])' "$accepted")
          echo "Dockhand queued job ${job}; waiting for it to finish."

          # Pulling two images and recreating takes well under a minute on that box;
          # five is generous enough that a timeout means something is actually wrong.
          for _ in $(seq 1 60); do
            sleep 5

            state=$(curl --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $DOCKHAND_TOKEN" \
              "$DOCKHAND_URL/api/jobs/$job")

            # A job that has fallen out of the store answers with an error and no
            # status, which is worth saying rather than waiting out the timeout.
            phase=$(printf '%s' "$state" | python3 -c 'import json,sys; a=json.load(sys.stdin); print(a.get("status") or "gone: " + a.get("error","no status"))')

            case "$phase" in
              done|complete|success)
                printf '%s' "$state" | python3 -c 'import json,sys; [print(line) for line in json.load(sys.stdin).get("lines", [])]'
                echo "Redeployed ${STACK}."
                exit 0
                ;;
              error|failed)
                printf '%s' "$state" | python3 -c 'import json,sys; [print(line) for line in json.load(sys.stdin).get("lines", [])]' >&2
                echo "Dockhand could not redeploy ${STACK}." >&2
                exit 1
                ;;
              gone:*)
                echo "Dockhand lost track of job ${job} - ${phase#gone: }" >&2
                exit 1
                ;;
            esac
          done

          echo "Job ${job} had not finished after five minutes." >&2
          exit 1
