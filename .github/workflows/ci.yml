name: CI

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore -c Release

      - name: Test with coverage
        working-directory: backend
        run: |
          dotnet test --no-build -c Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            --logger "trx;LogFileName=results.trx"

      - name: Check the coverage floor
        run: python3 scripts/check-coverage.py 'backend/TestResults/*/coverage.cobertura.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/TestResults/**/*.trx
            backend/TestResults/**/coverage.cobertura.xml

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  images:
    name: Build and publish images
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: api-meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/split-everything-api
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/metadata-action@v5
        id: web-meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/split-everything-web
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Publish the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Publish the web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Tell the server to pull
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Dockhand manages the stack on that box. Its own webhook is for git-linked
      # stacks and this one is a local compose file, so the redeploy goes through
      # its API instead: POST a stack by name and it pulls and recreates.
      #
      # Both secrets absent means nobody has wired this up, which is a fine state to
      # be in - the images are published either way and the box can pull them by
      # hand. It says so and passes rather than failing a release over a deploy
      # nobody asked for. What it will not do is what the old version of this job
      # did: report success while doing nothing at all.
      - name: Ask dockhand to redeploy the stack
        env:
          DOCKHAND_URL: ${{ secrets.DOCKHAND_URL }}
          DOCKHAND_TOKEN: ${{ secrets.DOCKHAND_TOKEN }}
          STACK: ${{ vars.DOCKHAND_STACK || 'split-everything' }}
          ENVIRONMENT_ID: ${{ vars.DOCKHAND_ENVIRONMENT_ID || '1' }}
        run: |
          if [ -z "$DOCKHAND_URL" ] || [ -z "$DOCKHAND_TOKEN" ]; then
            echo "DOCKHAND_URL or DOCKHAND_TOKEN is not set."
            echo "The images are published; pull them on the server with:"
            echo "  docker compose pull && docker compose up -d"
            exit 0
          fi

          status=$(curl --silent --show-error --output /dev/stderr \
            --write-out '%{http_code}' \
            --request POST \
            --max-time 300 \
            --header "Authorization: Bearer $DOCKHAND_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"pull": true}' \
            "$DOCKHAND_URL/api/stacks/$STACK/deploy?envId=$ENVIRONMENT_ID")

          echo "Dockhand answered ${status}"

          case "$status" in
            2*) echo "Redeployed ${STACK}." ;;
            401|403) echo "The token was refused. Generate a new one in Dockhand under Profile." >&2; exit 1 ;;
            404) echo "No stack called ${STACK} in environment ${ENVIRONMENT_ID}." >&2; exit 1 ;;
            *) echo "Dockhand refused the redeploy." >&2; exit 1 ;;
          esac
