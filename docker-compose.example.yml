services:
  postgres:
    image: postgres:17-alpine
    container_name: split-everything-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/user/appdata/split-everything/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  api:
    image: ${DOCKERHUB_USERNAME}/split-everything-api:${APP_TAG}
    container_name: split-everything-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Auth__JwtSigningKey=${JWT_SIGNING_KEY}
      - Auth__JwtIssuer=${PUBLIC_URL}
      - Auth__JwtAudience=${PUBLIC_URL}
      - Auth__GoogleClientId=${GOOGLE_CLIENT_ID}
      - Auth__AppBaseUrl=${PUBLIC_URL}
      - Cors__AllowedOrigins__0=${PUBLIC_URL}
      - ReceiptStorage__RootPath=/data/receipts
    volumes:
      - /mnt/user/appdata/split-everything/receipts:/data/receipts
    ports:
      - '8091:8080'
    labels:
      - "traefik.enable=true"
      # On two networks, so Traefik has to be told which one to dial.
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.split-api.rule=Host(`${PUBLIC_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/hubs`))"
      # Higher than the web router: both match the host, so this decides.
      - "traefik.http.routers.split-api.priority=20"
      - "traefik.http.routers.split-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.split-api.middlewares=secure-headers@file"
      - "traefik.http.services.split-api.loadbalancer.server.port=8080"
    healthcheck:
      # curl, not wget: this image has no wget.
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal
      - proxy

  web:
    image: ${DOCKERHUB_USERNAME}/split-everything-web:${APP_TAG}
    container_name: split-everything-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8090:8080'
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.split-web.rule=Host(`${PUBLIC_HOST}`)"
      - "traefik.http.routers.split-web.priority=10"
      - "traefik.http.routers.split-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.split-web.middlewares=secure-headers@file"
      - "traefik.http.services.split-web.loadbalancer.server.port=8080"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal
      - proxy

  backup:
    image: postgres:17-alpine
    container_name: split-everything-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGDATABASE=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS}
    volumes:
      - ./infra/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - /mnt/user/appdata/split-everything/backups:/backups
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']
    networks:
      - internal

networks:
  internal:
  proxy:
    external: true
