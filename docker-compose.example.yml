services:
  postgres:
    image: postgres:17-alpine
    container_name: split-everything-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/user/appdata/split-everything/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  api:
    image: ${DOCKERHUB_USERNAME}/split-everything-api:${APP_TAG}
    container_name: split-everything-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Auth__JwtSigningKey=${JWT_SIGNING_KEY}
      - Auth__JwtIssuer=${PUBLIC_URL}
      - Auth__JwtAudience=${PUBLIC_URL}
      - Auth__GoogleClientId=${GOOGLE_CLIENT_ID}
      - Auth__AppBaseUrl=${PUBLIC_URL}
      - Cors__AllowedOrigins__0=${PUBLIC_URL}
      - Push__VapidPublicKey=${VAPID_PUBLIC_KEY}
      - Push__VapidPrivateKey=${VAPID_PRIVATE_KEY}
      - Push__VapidSubject=${VAPID_SUBJECT}
      - ReceiptStorage__RootPath=/data/receipts
    volumes:
      - /mnt/user/appdata/split-everything/receipts:/data/receipts
      # ASP.NET writes a data protection key ring on start whether anything uses it
      # or not, and warns on every boot that a key ring inside a container does not
      # outlive it. Nothing in this app protects anything with it today - the refresh
      # token is opaque and hashed in the database, the access token is signed with
      # Auth__JwtSigningKey - so this is here to keep that true if something ever
      # does, and to stop the warning being noise in the log.
      #
      # Both directories must be owned by uid 1654, which is the app user in the
      # aspnet image. A root-owned bind mount here is a container that cannot write
      # its own keys, and one under receipts is uploads that fail with a permission
      # error at the moment somebody attaches a photo.
      - /mnt/user/appdata/split-everything/dataprotection:/home/app/.aspnet/DataProtection-Keys
    ports:
      - '8091:8080'
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.split-api.rule=Host(`${PUBLIC_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/hubs`))"
      - "traefik.http.routers.split-api.priority=20"
      - "traefik.http.routers.split-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.split-api.middlewares=secure-headers@file"
      - "traefik.http.services.split-api.loadbalancer.server.port=8080"
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal
      - proxy

  web:
    image: ${DOCKERHUB_USERNAME}/split-everything-web:${APP_TAG}
    container_name: split-everything-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8090:8080'
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.split-web.rule=Host(`${PUBLIC_HOST}`)"
      - "traefik.http.routers.split-web.priority=10"
      - "traefik.http.routers.split-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.split-web.middlewares=secure-headers@file"
      - "traefik.http.services.split-web.loadbalancer.server.port=8080"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal
      - proxy

  backup:
    image: postgres:17-alpine
    container_name: split-everything-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGDATABASE=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS}
    volumes:
      - /mnt/user/appdata/split-everything/backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        # pipefail as well as -e: the status of "pg_dump | gzip" is gzip's, and gzip
        # succeeds at compressing nothing. Without this a dump that failed to connect
        # wrote a valid twenty-byte archive and the script announced it as a backup.
        set -eu -o pipefail
        mkdir -p /backups
        while true; do
          stamp="$$(date -u '+%Y%m%d-%H%M%S')"
          target="/backups/$${PGDATABASE}-$${stamp}.sql.gz"
          echo "[$$(date -u '+%Y-%m-%dT%H:%M:%SZ')] dumping $${PGDATABASE}"
          if pg_dump --no-owner --no-privileges --clean --if-exists | gzip -9 > "$${target}.partial"; then
            mv "$${target}.partial" "$$target"
            echo "wrote $$(du -h "$$target" | cut -f1) to $$target"
            find /backups -name "$${PGDATABASE}-*.sql.gz" -type f -mtime "+$${BACKUP_RETENTION_DAYS}" -print -delete
          else
            rm -f "$${target}.partial"
            echo "dump failed; kept the previous backups"
          fi
          sleep 86400
        done
    networks:
      - internal

networks:
  internal:
  proxy:
    external: true
